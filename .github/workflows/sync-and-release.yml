name: Sync Upstream & Build Releases

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  sync-upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      new_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Add upstream and sync
        run: |
          git remote add upstream https://github.com/korotovsky/slack-mcp-server.git || true
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit || true
          git push origin main

      - name: Check for changes
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          FORK_SHA=$(git rev-parse origin/main~1 2>/dev/null || echo "none")
          if [ "$UPSTREAM_SHA" != "$FORK_SHA" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate version
        id: version
        run: |
          VERSION="v$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: sync-upstream
    if: needs.sync-upstream.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -o "slack-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}" \
            -ldflags="-s -w" \
            ./cmd/slack-mcp-server

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slack-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}
          path: slack-mcp-server-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [sync-upstream, build]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.sync-upstream.outputs.new_version }}
          name: "Auto-sync ${{ needs.sync-upstream.outputs.new_version }}"
          body: "Automated build synced from upstream korotovsky/slack-mcp-server"
          files: binaries/*
          make_latest: true
